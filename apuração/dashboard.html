<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Apuracao Financeira - SO LAJES</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-card-hover: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.12);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.12);
  --yellow: #eab308;
  --border: #334155;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 28px; font-weight: 800; }
.header h1 span { color: var(--accent); }
.header-info { text-align: right; color: var(--text-muted); font-size: 13px; }
.header-info strong { color: var(--text); }

/* Year Filter */
.year-filter {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.year-btn {
  padding: 8px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}
.year-btn:hover { background: var(--bg-card-hover); color: var(--text); }
.year-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.kpi-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  transition: transform 0.2s, box-shadow 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.kpi-value { font-size: 24px; font-weight: 700; }
.kpi-value.green { color: var(--green); }
.kpi-value.red { color: var(--red); }
.kpi-value.blue { color: var(--accent); }
.kpi-value.yellow { color: var(--yellow); }
.kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* Charts Grid */
.charts-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}
.chart-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
}
.chart-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.chart-container { position: relative; height: 300px; }

/* Monthly Table */
.table-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid var(--border);
  margin-bottom: 32px;
}
.table-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  padding: 12px 16px;
  border-bottom: 2px solid var(--border);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
tr { cursor: pointer; transition: background 0.15s; }
tbody tr:hover { background: var(--bg-card-hover); }
.val-green { color: var(--green); font-weight: 600; }
.val-red { color: var(--red); font-weight: 600; }
.val-blue { color: var(--accent); font-weight: 600; }

/* Transaction Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 800px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  border: 1px solid var(--border);
  box-shadow: 0 8px 48px rgba(0,0,0,0.5);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 18px; font-weight: 700; }
.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--bg-card-hover); color: var(--text); }
.tx-table { width: 100%; }
.tx-table td { padding: 8px 12px; font-size: 13px; }
.tx-table tr:hover { background: rgba(59,130,246,0.08); }
.tx-date { color: var(--text-muted); white-space: nowrap; width: 100px; }
.tx-desc { color: var(--text); }
.tx-val { text-align: right; white-space: nowrap; font-weight: 600; width: 120px; }

/* Responsive */
@media (max-width: 900px) {
  .charts-grid { grid-template-columns: 1fr; }
  .header { flex-direction: column; text-align: center; }
  .header-info { text-align: center; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .container { padding: 12px; }
  .kpi-value { font-size: 20px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1><span>Dashboard</span> de Apuracao Financeira</h1>
    <div class="header-info">
      <div><strong>SO LAJES</strong></div>
      <div>CNPJ: 14.643.142/0002-62</div>
      <div>Agencia: 7314 | Conta: 0096669-3</div>
      <div>Periodo: Jan/2025 a Mar/2026</div>
    </div>
  </div>

  <div class="year-filter">
    <button class="year-btn active" data-year="todos">Todos</button>
    <button class="year-btn" data-year="2024">2024</button>
    <button class="year-btn" data-year="2025">2025</button>
    <button class="year-btn" data-year="2026">2026</button>
  </div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>Entradas vs Saidas por Mes</h3>
      <div class="chart-container"><canvas id="barChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Distribuicao por Tipo</h3>
      <div class="chart-container"><canvas id="pieChart"></canvas></div>
    </div>
  </div>

  <div class="chart-card" style="margin-bottom:32px">
    <h3>Evolucao do Saldo Acumulado</h3>
    <div class="chart-container"><canvas id="lineChart"></canvas></div>
  </div>

  <div class="table-card">
    <h3>Resumo Mensal</h3>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Mes/Ano</th>
            <th>Transacoes</th>
            <th style="text-align:right">Entradas</th>
            <th style="text-align:right">Saidas</th>
            <th style="text-align:right">Saldo</th>
            <th style="text-align:right">Saldo Acumulado</th>
          </tr>
        </thead>
        <tbody id="monthly-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Transaction Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Transacoes</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const DATA = [
  {"month":"12/2024","monthName":"Dez/2024","entradas":361.93,"saidas":0,"saldo":361.93,"balance":361.93,"count":1},
  {"month":"01/2025","monthName":"Jan/2025","entradas":621598.48,"saidas":37594.61,"saldo":584003.87,"balance":584365.80,"count":41},
  {"month":"02/2025","monthName":"Fev/2025","entradas":1917176.83,"saidas":354921.68,"saldo":1562255.15,"balance":2146620.95,"count":81},
  {"month":"03/2025","monthName":"Mar/2025","entradas":1809404.25,"saidas":213587.75,"saldo":1595816.50,"balance":3742437.45,"count":71},
  {"month":"04/2025","monthName":"Abr/2025","entradas":956966.19,"saidas":291452.46,"saldo":665513.73,"balance":4407951.18,"count":77},
  {"month":"05/2025","monthName":"Mai/2025","entradas":943602.91,"saidas":444751.07,"saldo":498851.84,"balance":4906803.02,"count":76},
  {"month":"06/2025","monthName":"Jun/2025","entradas":688311.67,"saidas":358764.99,"saldo":329546.68,"balance":5236349.70,"count":60},
  {"month":"07/2025","monthName":"Jul/2025","entradas":1669184.52,"saidas":409691.51,"saldo":1259493.01,"balance":6495842.71,"count":82},
  {"month":"08/2025","monthName":"Ago/2025","entradas":1163391.70,"saidas":193754.04,"saldo":969637.66,"balance":7465480.37,"count":57},
  {"month":"09/2025","monthName":"Set/2025","entradas":1721450.81,"saidas":389988.96,"saldo":1331461.85,"balance":8796942.22,"count":188},
  {"month":"10/2025","monthName":"Out/2025","entradas":5026602.85,"saidas":721297.55,"saldo":4305305.30,"balance":13102247.52,"count":327},
  {"month":"11/2025","monthName":"Nov/2025","entradas":4138020.10,"saidas":623401.24,"saldo":3514618.86,"balance":16616866.38,"count":335},
  {"month":"12/2025","monthName":"Dez/2025","entradas":2352171.85,"saidas":1056341.40,"saldo":1295830.45,"balance":17912696.83,"count":436},
  {"month":"01/2026","monthName":"Jan/2026","entradas":4098853.37,"saidas":841111.80,"saldo":3257741.57,"balance":21170438.40,"count":372},
  {"month":"02/2026","monthName":"Fev/2026","entradas":3455401.42,"saidas":676526.55,"saldo":2778874.87,"balance":23949313.27,"count":362},
  {"month":"03/2026","monthName":"Mar/2026","entradas":4517308.97,"saidas":892731.39,"saldo":3624577.58,"balance":27573890.85,"count":392}
];

let currentYear = 'todos';
let barChart, lineChart, pieChart;

function fmt(n) {
  return n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function getFiltered() {
  if (currentYear === 'todos') return DATA;
  return DATA.filter(d => d.month.endsWith('/' + currentYear));
}

function renderKPIs() {
  const data = getFiltered();
  const totalE = data.reduce((s,d) => s + d.entradas, 0);
  const totalS = data.reduce((s,d) => s + d.saidas, 0);
  const saldoAtual = data.length > 0 ? data[data.length-1].balance : 0;
  const avgE = data.length > 0 ? totalE / data.length : 0;
  const avgS = data.length > 0 ? totalS / data.length : 0;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Saldo Atual</div>
      <div class="kpi-value blue">R$ ${fmt(saldoAtual)}</div>
      <div class="kpi-sub">Acumulado no periodo</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Entradas</div>
      <div class="kpi-value green">R$ ${fmt(totalE)}</div>
      <div class="kpi-sub">${data.reduce((s,d)=>s+d.count,0)} transacoes</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Saidas</div>
      <div class="kpi-value red">R$ ${fmt(totalS)}</div>
      <div class="kpi-sub">Periodo selecionado</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Media Mensal Entradas</div>
      <div class="kpi-value green">R$ ${fmt(avgE)}</div>
      <div class="kpi-sub">${data.length} meses</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Media Mensal Saidas</div>
      <div class="kpi-value red">R$ ${fmt(avgS)}</div>
      <div class="kpi-sub">${data.length} meses</div>
    </div>
  `;
}

function renderCharts() {
  const data = getFiltered();
  const labels = data.map(d => d.monthName);

  // Bar Chart
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Entradas', data: data.map(d => d.entradas), backgroundColor: 'rgba(34,197,94,0.7)', borderRadius: 4 },
        { label: 'Saidas', data: data.map(d => d.saidas), backgroundColor: 'rgba(239,68,68,0.7)', borderRadius: 4 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8' } } },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51,65,85,0.5)' } },
        y: { ticks: { color: '#94a3b8', callback: v => (v/1000).toFixed(0) + 'k' }, grid: { color: 'rgba(51,65,85,0.5)' } }
      }
    }
  });

  // Line Chart
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Saldo Acumulado',
        data: data.map(d => d.balance),
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.1)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#3b82f6'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#94a3b8' } } },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(51,65,85,0.5)' } },
        y: { ticks: { color: '#94a3b8', callback: v => (v/1000000).toFixed(1) + 'M' }, grid: { color: 'rgba(51,65,85,0.5)' } }
      }
    }
  });

  // Pie Chart
  const totalE = data.reduce((s,d) => s + d.entradas, 0);
  const totalS = data.reduce((s,d) => s + d.saidas, 0);
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: ['Entradas', 'Saidas'],
      datasets: [{
        data: [totalE, totalS],
        backgroundColor: ['rgba(34,197,94,0.8)', 'rgba(239,68,68,0.8)'],
        borderColor: ['#22c55e', '#ef4444'],
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 16 } },
        tooltip: { callbacks: { label: ctx => ctx.label + ': R$ ' + fmt(ctx.raw) } }
      }
    }
  });
}

function renderTable() {
  const data = getFiltered();
  const tbody = document.getElementById('monthly-tbody');
  tbody.innerHTML = data.map(d => `
    <tr onclick="openMonth('${d.month}')">
      <td><strong>${d.monthName}</strong></td>
      <td>${d.count}</td>
      <td class="val-green" style="text-align:right">R$ ${fmt(d.entradas)}</td>
      <td class="val-red" style="text-align:right">R$ ${fmt(d.saidas)}</td>
      <td class="${d.saldo >= 0 ? 'val-green' : 'val-red'}" style="text-align:right">R$ ${fmt(d.saldo)}</td>
      <td class="val-blue" style="text-align:right">R$ ${fmt(d.balance)}</td>
    </tr>
  `).join('');
}

function openMonth(month) {
  const d = DATA.find(x => x.month === month);
  if (!d) return;
  document.getElementById('modal-title').textContent = 'Transacoes - ' + d.monthName;
  document.getElementById('modal-body').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
      <div style="text-align:center;padding:12px;background:var(--green-bg);border-radius:8px">
        <div style="font-size:11px;color:var(--text-muted)">Entradas</div>
        <div style="font-size:18px;font-weight:700;color:var(--green)">R$ ${fmt(d.entradas)}</div>
      </div>
      <div style="text-align:center;padding:12px;background:var(--red-bg);border-radius:8px">
        <div style="font-size:11px;color:var(--text-muted)">Saidas</div>
        <div style="font-size:18px;font-weight:700;color:var(--red)">R$ ${fmt(d.saidas)}</div>
      </div>
      <div style="text-align:center;padding:12px;background:rgba(59,130,246,0.12);border-radius:8px">
        <div style="font-size:11px;color:var(--text-muted)">Saldo</div>
        <div style="font-size:18px;font-weight:700;color:var(--accent)">R$ ${fmt(d.saldo)}</div>
      </div>
    </div>
    <div style="text-align:center;color:var(--text-muted);font-size:13px">Clique em uma linha da tabela para ver detalhes do mes</div>
  `;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Year filter
document.querySelectorAll('.year-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentYear = this.dataset.year;
    renderKPIs();
    renderCharts();
    renderTable();
  });
});

// Initial render
renderKPIs();
renderCharts();
renderTable();
</script>
</body>
</html>
